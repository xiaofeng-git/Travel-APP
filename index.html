<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>童年山林寻宝</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: #1a1a1a;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        .container {
            display: flex;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px;
        }
        .side {
            width: 12%;
            height: 85vh;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            opacity: 0.65;
            border-radius: 8px;
            transition: 0.3s;
        }
        .side:hover {
            opacity: 1;
            transform: scale(1.02);
        }
        .main {
            width: 70%;
            height: 85vh;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            cursor: crosshair;
            box-shadow: 0 0 40px rgba(0,0,0,0.6);
        }
        .main-bg {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: background 0.5s ease;
        }
        .tip {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 20px;
            text-shadow: 0 0 8px #000;
            z-index: 999;
        }
        .hint-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 28px;
            background: #ff9100;
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            z-index: 999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .hint-btn:hover {
            background: #ff6b00;
        }
        .mark {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 3px solid #ffeb3b;
            border-radius: 50%;
            background: rgba(255,235,59,0.2);
            animation: pulse 1s infinite alternate;
            pointer-events: none;
            z-index: 10;
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }
        .click {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid #fff;
            border-radius: 50%;
            pointer-events: none;
            animation: ring 0.6s forwards;
        }
        @keyframes ring {
            0% { transform: scale(0.2); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        /* --------------------------
        以下是：美化后的 贺卡 + 奖状
        --------------------------- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .modal.show {
            display: flex;
            animation: fadeIn 0.4s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 贺卡样式 */
        .card-box {
            width: 90%;
            max-width: 700px;
            height: 80vh;
            max-height: 600px;
            background: url("https://picsum.photos/id/15/1600/1200") center/cover no-repeat;
            border-radius: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            padding: 40px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
            animation: cardPop 1s ease;
        }
        .card-box h2 {
            font-size: 42px;
            margin-bottom: 30px;
        }
        .card-box p {
            font-size: 24px;
            line-height: 1.8;
        }

        /* 奖状样式 */
        .cert-box {
            width: 90%;
            max-width: 700px;
            height: 80vh;
            max-height: 600px;
            background: url("https://picsum.photos/id/106/1600/1200") center/cover no-repeat;
            border-radius: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #a82020;
            padding: 40px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
            animation: certPop 1s ease;
        }
        .cert-box h2 {
            font-size: 46px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .cert-box p {
            font-size: 26px;
            line-height: 2;
            font-weight: 500;
        }

        @keyframes cardPop {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes certPop {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .close {
            margin-top: 30px;
            padding: 12px 30px;
            background: #ff4444;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="tip">🎈 点击画面寻找宝藏 | 左右切换风景 🎈</div>

    <div class="container">
        <div class="side" id="left"></div>
        <div class="main" id="main">
            <div class="main-bg" id="bg"></div>
        </div>
        <div class="side" id="right"></div>
    </div>

    <button class="hint-btn" id="hint">提示宝藏位置</button>

    <!-- 贺卡 -->
    <div class="modal" id="cardModal">
        <div class="card-box">
            <h2>💌 六一贺卡</h2>
            <p id="cardContent"></p>
            <p style="margin-top:20px;">🎉 儿童节快乐 🎉</p>
            <button class="close" onclick="closeModal()">关闭</button>
        </div>
    </div>

    <!-- 奖状 -->
    <div class="modal" id="certModal">
        <div class="cert-box">
            <h2>🏆 荣誉奖状</h2>
            <p>授予：可爱的大朋友</p>
            <p id="certContent" style="font-weight:bold; color:#c0392b;"></p>
            <p>特发此状，以资鼓励！</p>
            <p style="margin-top:20px;">🎈 儿童节快乐 🎈</p>
            <button class="close" onclick="closeModal()">关闭</button>
        </div>
    </div>

    <script>
        const imgs = [
            "https://picsum.photos/id/15/1920/1080",
            "https://picsum.photos/id/11/1920/1080",
            "https://picsum.photos/id/12/1920/1080"
        ];
        let idx = 0;

        const points = [
            {x:0.15,y:0.25},{x:0.32,y:0.4},{x:0.5,y:0.2},
            {x:0.68,y:0.55},{x:0.82,y:0.3},{x:0.22,y:0.7},{x:0.75,y:0.78}
        ];

        const cards = [
            "愿你童心未泯，所遇皆甜🍬",
            "山林寻宝，快乐无限✨",
            "保持热爱，永远少年🌿",
            "简单的小美好，藏在风景里💛",
            "愿你眼里有光，心中有爱💌"
        ];

        const certs = [
            "荣获：寻宝小能手 称号",
            "荣获：童心常驻奖 称号",
            "荣获：怀旧达人奖 称号",
            "荣获：快乐童年奖 称号",
            "荣获：永葆童心优秀奖 称号"
        ];

        let main = document.getElementById("main");
        let bg = document.getElementById("bg");
        let left = document.getElementById("left");
        let right = document.getElementById("right");
        let hint = document.getElementById("hint");
        let mark = null;
        let treasure = randomPoint();

        function update() {
            bg.style.backgroundImage = `url(${imgs[idx]})`;
            left.style.backgroundImage = `url(${imgs[(idx+2)%3]})`;
            right.style.backgroundImage = `url(${imgs[(idx+1)%3]})`;
            if(mark) mark.remove();
        }
        update();

        left.onclick = () => { idx = (idx+2)%3; update(); treasure = randomPoint(); }
        right.onclick = () => { idx = (idx+1)%3; update(); treasure = randomPoint(); }

        function randomPoint() {
            let p = points[Math.floor(Math.random()*points.length)];
            return { x: p.x*main.offsetWidth, y: p.y*main.offsetHeight };
        }

        hint.onclick = () => {
            if(mark) mark.remove();
            mark = document.createElement("div");
            mark.className = "mark";
            mark.style.left = treasure.x - 25 + "px";
            mark.style.top = treasure.y - 25 + "px";
            main.appendChild(mark);
        };

        main.onclick = (e) => {
            let rect = main.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;

            let r = document.createElement("div");
            r.className = "click";
            r.style.left = e.clientX-20+"px";
            r.style.top = e.clientY-20+"px";
            document.body.appendChild(r);
            setTimeout(()=>r.remove(),600);

            if(Math.abs(x-treasure.x)<70 && Math.abs(y-treasure.y)<70) {
                openReward();
                treasure = randomPoint();
                if(mark) mark.remove();
            }
        };

        function openReward() {
            let type = Math.random() > 0.5 ? "card" : "cert";
            if(type === "card") {
                let txt = cards[Math.floor(Math.random()*cards.length)];
                document.getElementById("cardContent").innerText = txt;
                document.getElementById("cardModal").classList.add("show");
            } else {
                let txt = certs[Math.floor(Math.random()*certs.length)];
                document.getElementById("certContent").innerText = txt;
                document.getElementById("certModal").classList.add("show");
            }
        }

        function closeModal() {
            document.querySelectorAll(".modal").forEach(m=>m.classList.remove("show"));
        }
    </script>
</body>
</html>
